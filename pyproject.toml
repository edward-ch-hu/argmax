[project]
name = "argmax"
version = "0.1.0"
description = "An AI agent that runs your Google Ads account inside hard guardrails: argmax over spend of real deals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "google-ads>=28",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
