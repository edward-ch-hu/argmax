# argmax config. Copy to argmax.yaml (gitignored) or run `uv run scripts/init.py`.
# Every value below is a fictional example for "Acme Analytics", a made-up SaaS. Replace them with yours.
# Secrets do NOT go here: Google Ads credentials (OAuth client, refresh token) live in google-ads.yaml or GOOGLE_ADS_* env vars.
# Cloud routines: commit this file in your private fork, or put its contents in ARGMAX_CONFIG_YAML (see SETUP.md).

account:
  customer_id: "123-456-7890"        # the ad account the agent runs (10 digits, dashes optional)
  login_customer_id: ""              # empty when your Google login has direct access to the ad account (the usual case);
                                     # the manager account's id only if you reach the ad account through one
  name: Acme Analytics               # used in report titles
  currency: USD                      # the account's currency (check_connection.py warns on a mismatch)
  timezone: America/New_York         # IANA name; the routines' "today" and "yesterday" use it

api:
  access_level: explorer     # unknown | test | explorer | basic | standard: your Cloud project's Google Ads API access
                             # level, as its Overview page shows it (console.cloud.google.com/google/ads-apis/overview).
                             # explorer = 2,880 operations a day on live accounts, no Keyword Planner; basic = 15,000

business:                    # the business profile: what success means, where you sell, how you want to be told
  goal: leads                # leads | sales | roas | calls | awareness; must fit STRATEGY.md's "Fits goals" (doctor.py)
  goal_description: "Trials that turn into paid plans, at the same total budget"   # one line, the owner's words
  primary_kpi: CRM wins      # what success is counted in (e.g. CRM wins, purchase value, qualified calls)
  kpi_conversions: ["Demo Request"]   # Google Ads actions that stand for the KPI; each must be in conversions.lead_signals
  markets:                   # where you advertise and in which language; the one source for site and ad locales
    - name: North America
      countries: [US, CA]    # country codes or region names as targeted in Google Ads
      language: en           # the ad language = the site locale its ads and claims use (website.locales derive from it)
      campaign_prefix: "US - "   # campaigns starting with this belong to the market (ad_tests.campaign_locales derive from it)
  report_language: English   # weekly and monthly reports, decisions and the client update are written in it
  deal_currency: USD         # the currency of CRM deal values; defaults to account.currency (see crm.deal_value_fx)
  bidding_end_state: manual_cpc   # smart_bidding | manual_cpc: where bidding ends up; must match STRATEGY.md's
                             # "Bidding end state" line (doctor.py). smart_bidding: a last phase hands bids to Google's
                             # Smart Bidding (high conversion volume, clean conversion data). manual_cpc: the agent keeps
                             # Manual CPC for good (low volume or noisy conversions, real deals judged offline); then
                             # guard.expected_bidding must stay MANUAL_CPC and no routine proposes a bid strategy switch

limits:                      # the hard guardrails; apply_changes.py refuses a file that breaks them
  daily_budget_cap: 150      # total daily budget across enabled campaigns, account currency
  weekly_bid_change: 0.20    # an ad group bid may move at most 20% from its Monday bid per week
  bid_floor: 0.30            # no ad group bid below this
  bid_ceiling: 6.00          # or above this
  allow_enable_performance_max: false

guard:                       # daily_guard.py alerts
  expected_bidding: MANUAL_CPC   # alert when an enabled campaign uses another strategy; null to skip
  search_networks_only: true     # alert on Display Expansion / Search Partners in Search campaigns
  overspend_multiple: 2.0        # alert when a campaign spends over 2x its daily budget in a day

stepping:                    # daily_bids.py: daily bid steps for winning-topic Search ad groups
  enabled: true
  step: 0.10                 # 10% per day
  weekly_limit: 0.30         # at most +/-30% from Monday's bid within a week
  window_days: 14            # steps for 14 days from its first daily evaluation, then the weekly owns the bid
  rank_lost_band: [0.20, 0.50]   # aim: lose 20% to 50% of impressions to ad rank
  budget_lost_max: 0.20      # hold when the campaign loses over 20% to budget (fix the budget instead)
  min_impressions: 30        # never lower a bid on fewer impressions than this
  new_groups: {}             # "Ad group name": "YYYY-MM-DD" skips the weekly limit until that date

market_price:                # Google's first-position CPC estimate for a group's keywords, weighted by their impressions
                             # over 30 days (market_price.py). Only ever a ceiling, and never over safety_limit
  safety_limit: 15.00        # the hard cap over any estimate; needed by a market ceiling (experiments or groups)
  fallback: null             # the ceiling when Google has no estimate; null = limits.bid_ceiling
  groups: []                 # winning groups whose daily steps go up to the market price instead of
                             # limits.bid_ceiling, e.g. [{campaign: "US - Search", ad_group: "Analytics"}]

# Experiments: time-boxed bid tests run by daily_bids.py and judged by experiments.py (README, "Experiments"). One
# starts only after the owner's "yes" on a "Needs yes" decision, and the owner adds it here (or to
# ARGMAX_CONFIG_YAML): the routines never edit this file. Example (remove "[]" and the "#" to use it):
experiments: []
#  - id: analytics-ceiling        # short and unique; the ledger and the decisions use it
#    type: ceiling_test           # how high can the bid usefully go?
#    campaign: "US - Search"      # exact names
#    ad_group: "Analytics"
#    start: 2026-03-02            # the first daily run that steps it
#    end: 2026-03-23              # the last one; the weekly judges the kill rule from this date
#    step: 0.20                   # 20% a day...
#    weekly_limit: 0.60           # ...and at most +/-60% from the Monday bid
#    stop_rank_lost: 0.10         # raised while it loses over 10% to rank; never lowered for being visible
#    ceiling: market              # market (market_price, under its safety_limit) or fixed (with ceiling_amount: 8.00)
#    pre_test: {bid: 2.00, budget: 60}   # bid and campaign budget before the test: the kill rule reverts to them
#    kill: {min_leads: 1, max_cost_per_lead: 400}   # judged on the end date: fewer new leads, or a higher cost
#                                 # per lead, reverts to pre_test; otherwise it passed and the weekly owns the bid
#    mid_check: {min_click_rise: 0.15, max_cpc_rise: 0.30, window_days: 7, min_days: 3}   # clicks a day up under
#                                 # 15% while CPC up over 30% between the last two bid levels: end early, bid to the knee
#    reserve: {base_cap: 120}     # optional: limits.daily_budget_cap was 120 before the test; until the end date the
#                                 # other campaigns together stay at or under 120 - pre_test.budget (or others_max: <n>)

negatives:                   # daily_negatives.py and keyword_review.py
  max_per_day: 10
  lookback_days: 7
  protect_days: 30           # a term with any lead-signal conversion in its campaign this many days is never blocked
                             # by spend or clicks (junk words still block); 0 turns the protection off
  min_cost: 5.0              # a search term with this much spend and 0 lead-signal conversions is a negative...
  min_cost_clicks: 3         # ...once it also has this many clicks (one pricey click in a quiet account is not enough)
  min_clicks: 10             # or this many clicks and 0 lead-signal conversions
  held_notify_cost: 8.0      # NOTIFY when a held winning-topic term costs this much
  junk_words: [free, download, crack, torrent, jobs, job, salary, career, tutorial, course, github, reddit]

keyword_review:
  min_positive_conversions: 2
  min_pause_cost: 40.0
  ideas: auto                # auto: Keyword Planner ideas unless api.access_level is test or explorer, and skipped with
                             # a NOTE when Google refuses them (access level, quota); off: never ask for ideas
  ideas_per_ad_group: 8
  ideas_min_monthly_searches: 10

match_type_review:
  broad_to_phrase_share: 0.30
  phrase_to_exact_share: 0.50
  min_off_intent_spend: 15.0

# What you sell, so spend, search terms and CRM leads can be grouped. substrings match anywhere in the text;
# words match whole tokens only (use them for short words like "bi" that hide inside other words).
topics:
  analytics:
    substrings: [analytics, "web stats", "traffic report", "visitor tracking"]
    words: [bi]
  dashboards:
    substrings: [dashboard, "kpi board", "metrics wall"]
    words: []
  reporting:
    substrings: [reporting, "scheduled report", "pdf report"]
    words: []
winning_topics: [analytics]          # topics that close deals: daily bid steps, held negatives, test priority
ad_group_topics:                     # exact ad group names -> topic (anything else counts as "other")
  "Analytics": analytics
  "Dashboards": dashboards
  "Reporting": reporting
  "RMK - Analytics": analytics

conversions:
  lead_signals: ["Demo Request", "Signup"]   # counted as leading signals (never as deals)
  noise_signals: ["Chat Widget Open"]        # shown in tables, never used for any judgment

website:                     # the source of truth for every ad claim (claims_check.py)
  base_url: https://www.example.com
  # locales: derived from business.markets (one language per market); set it only to add site-only locales
  user_agent: argmax claims check

ad_tests:
  enabled: true
  library: docs/ad_library.json      # copy docs/ad_library.example.json there and fill it from your own site
  # campaign_locales and default_locale: derived from business.markets (campaign_prefix -> language, first market)
  min_impressions_14d: 300
  max_running: 3
  max_new_per_week: 1
  min_days: 28
  max_days: 56
  min_arm_impressions: 1000
  z: 1.96
  claims_max_age_days: 7

crm:
  source: none               # none | csv | google_sheets
  csv_path: docs/crm.example.csv
  sheet_id: ""               # google_sheets: the id in the sheet's URL
  sheet_range: "Sheet1!A1:Z"
  date_format: null          # strptime format if dates are not YYYY-MM-DD or YYYY/MM/DD
  columns:                   # header names in the first row
    id: null                 # a stable lead id, if you have one (else name + email + date is hashed)
    lead_date: Lead date
    status: Status
    topics: [Product]        # one header or a list (first non-empty wins); matched against topics above
    deal_value: MRR
    name: Name               # never printed; used for the fingerprint and the client-update leak check
    email: Email
    ref: null                # a column holding ref codes; null searches every cell
  statuses:                  # your status values -> funnel stage (case-insensitive exact match)
    talking: [New, Contacted, Quoted]
    trial: [Trial]
    won: [Won]
    lost_after_trial: [Lost after trial]
    lost_no_trial: [Lost]
  default_status: talking    # an unknown status counts as an open lead
  deal_value_label: MRR
  deal_value_fx: null        # account currency per 1 business.deal_currency (e.g. 1.29 SGD per USD); only when they differ
  stale_after_days: 14       # ALERT when the CRM has no new entry for this long

ref_codes:                   # optional: tie CRM leads to ad clicks (docs/ref-codes.md)
  enabled: false
  prefix: "AM-"
  live_from: null            # YYYY-MM-DD your site started adding codes
  test_codes: []             # codes from your own test clicks, ignored

tracker:                     # where reports and decisions go: read trackers/<backend>.md
  backend: github-issues     # github-issues | files | clickup | notion | linear
  github:
    repo: ""                 # owner/name; empty = the repo of the checkout
    assignee: ""             # GitHub login that gets decisions (no @)
  clickup: {weekly_list_id: "", monthly_list_id: "", decisions_list_id: "", assignee: ""}
  notion: {weekly_database_id: "", monthly_database_id: "", decisions_database_id: ""}
  linear: {team_id: "", project_id: "", assignee: ""}

report:
  history_start: null        # YYYY-MM the monthly history starts; null = the last 12 months
  client_update:
    enabled: true            # the monthly writes a message for a client or stakeholder
    # language: defaults to business.report_language; set it when the client reads another language
    blocklist: []            # extra words the client update must never contain (competitor brands, codenames)
